<!DOCTYPE html>
<html>
<head>
    <title>Tasks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>TaskFlow 📋</h1>

        <form method="POST">
            <input type="text" name="task" placeholder="Enter a task..." required>
            <button type="submit">Add</button>
        </form>

        <ul>
            {% for task in tasks %}
                <li>
                    {{ task }}
                    <a class="delete-btn" href="/delete/{{ loop.index0 }}">✖</a>
                </li>
            {% endfor %}
        </ul>

        <a class="back-link" href="/">← Back Home</a>
    </div>
</body>
</html>
